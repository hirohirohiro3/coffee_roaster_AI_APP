<section id="roastFormSection" class="mb-8 p-6 bg-[var(--bg-primary)] rounded-lg shadow-md hidden">
    <h2 id="formTitle" class="text-2xl font-semibold mb-4 text-[var(--accent-color)]" data-i18n-key="addNewRoast"></h2>
    <form id="roastForm" class="space-y-8">
        <input type="hidden" id="editRoastId" name="editRoastId">

        <fieldset class="border-t pt-4 border-[var(--border-color)]">
            <legend class="text-lg font-medium text-[var(--text-primary)] mb-4" data-i18n-key="roastPlan"></legend>
            <div class="space-y-4">
                <div>
                    <label for="beanIdSelect" class="block text-sm font-medium text-[var(--text-secondary)] mb-1" data-i18n-key="beanToUse"></label>
                    <select id="beanIdSelect" name="beanId" required class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm text-[var(--text-primary)]"></select>
                </div>
                <div>
                    <label for="roastDate" class="block text-sm font-medium text-[var(--text-secondary)] mb-1" data-i18n-key="roastDateLabel"></label>
                    <input type="date" id="roastDate" name="roastDate" required class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]">
                </div>
                <div>
                    <label for="roastLevelSlider" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="targetRoastLevel"></label>
                    <input type="range" id="roastLevelSlider" name="roastLevelSlider" min="1" max="8" value="5" class="w-full h-2 bg-[var(--border-color)] rounded-lg appearance-none cursor-pointer mt-2">
                    <div id="roastLevelLabel" class="text-center text-sm text-[var(--text-primary)] font-semibold mt-1" data-i18n-key="roastLevelCity"></div>
                    <input type="hidden" id="roastLevel" name="roastLevel" value="シティロースト">
                </div>
                <div>
                    <label for="greenBeanWeight" class="block text-sm font-medium text-[var(--text-secondary)] mb-1" data-i18n-key="greenBeanWeightKg"><span class="text-red-500">*</span></label>
                    <input type="number" id="greenBeanWeight" name="greenBeanWeight" step="0.001" required class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]" data-i18n-placeholder-key="greenBeanWeightPlaceholder">
                </div>
                <div>
                    <label for="targetFlavor" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="targetFlavorProfileOptional"></label>
                    <input type="text" id="targetFlavor" name="targetFlavor" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]" data-i18n-placeholder-key="targetFlavorProfilePlaceholder">
                </div>
                <div>
                    <label for="roasterModel" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="roasterModelOptional"></label>
                    <input type="text" id="roasterModel" name="roasterModel" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]" data-i18n-placeholder-key="roasterModelPlaceholder">
                </div>
                <div class="space-y-2 pt-4 border-t border-[var(--border-color)]">
                    <h3 class="text-md font-medium text-[var(--text-primary)]" data-i18n-key="roastWeatherOptional"></h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="roastWeatherTemp" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="temperatureC"></label>
                            <input type="text" id="roastWeatherTemp" name="roastWeatherTemp" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-secondary)] border border-[var(--border-color)] rounded-md shadow-sm sm:text-sm text-[var(--text-primary)]" readonly data-i18n-placeholder-key="notAvailable">
                        </div>
                        <div>
                            <label for="roastWeatherHumidity" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="humidityPct"></label>
                            <input type="text" id="roastWeatherHumidity" name="roastWeatherHumidity" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-secondary)] border border-[var(--border-color)] rounded-md shadow-sm sm:text-sm text-[var(--text-primary)]" readonly data-i18n-placeholder-key="notAvailable">
                        </div>
                    </div>
                    <button type="button" id="fetchWeatherButton" class="mt-2 px-3 py-1.5 border border-blue-500 rounded-md shadow-sm text-sm font-medium text-blue-600 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-400" data-i18n-key="fetchCurrentWeather"></button>
                </div>
                <div class="space-y-4 pt-4 border-t border-[var(--border-color)]">
                    <h3 class="text-md font-medium text-[var(--text-primary)]" data-i18n-key="aiIntegration"></h3>
                    <div class="tooltip">
                        <button type="button" id="generateAiPromptButton" class="w-full px-4 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700" data-i18n-key="createAiPrompt">
                        </button>
                        <span class="tooltiptext" data-i18n-key="createAiPromptTooltip"></span>
                    </div>
                    <div>
                        <label for="aiProfileInput" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="pasteAiSuggestion"></label>
                        <textarea id="aiProfileInput" rows="5" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]" data-i18n-placeholder-key="pasteAiSuggestionPlaceholder"></textarea>
                    </div>
                    <div class="tooltip">
                        <button type="button" id="applyAiProfileButton" class="w-full px-4 py-2 bg-teal-600 text-white font-medium rounded-md hover:bg-teal-700" data-i18n-key="applyAiSuggestion">
                        </button>
                        <span class="tooltiptext" data-i18n-key="applyAiSuggestionTooltip"></span>
                    </div>
                </div>
            </div>
        </fieldset>
        
        <fieldset class="border-t pt-4 border-[var(--border-color)]">
            <legend class="text-lg font-medium text-[var(--text-primary)] mb-4" data-i18n-key="roastInProgress"></legend>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="chargingTemperature" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="chargingTempC"></label>
                    <input type="number" id="chargingTemperature" name="chargingTemperature" step="0.1" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]">
                </div>
                <div>
                    <label for="turningPointTime" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="turningPointTimeLabel"></label>
                    <input type="text" id="turningPointTime" name="turningPointTime" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]">
                </div>
                <div>
                    <label for="turningPointTemp" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="turningPointTempLabel"></label>
                    <input type="number" id="turningPointTemp" name="turningPointTemp" step="0.1" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]">
                </div>
                <div>
                    <label for="firstCrackTime" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="firstCrackTimeLabel"></label>
                    <input type="text" id="firstCrackTime" name="firstCrackTime" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]">
                </div>
                <div>
                    <label for="secondCrackTime" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="secondCrackTimeLabel"></label>
                    <input type="text" id="secondCrackTime" name="secondCrackTime" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]">
                </div>
                 <div>
                    <label for="endOfRoastTemp" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="endOfRoastTempC"></label>
                    <input type="number" id="endOfRoastTemp" name="endOfRoastTemp" step="0.1" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]">
                </div>
            </div>
        </fieldset>

        <fieldset class="border-t pt-4 border-[var(--border-color)]">
            <legend class="text-lg font-medium text-[var(--text-primary)] mb-4" data-i18n-key="roastReview"></legend>
            <div class="space-y-4">
                <!-- Time and Weight -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="totalRoastTime" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="totalRoastTime"></label>
                        <input type="text" id="totalRoastTime" name="totalRoastTime" required class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]">
                    </div>
                    <div>
                        <label for="roastedBeanWeight" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="roastedBeanWeight"></label>
                        <input type="number" id="roastedBeanWeight" name="roastedBeanWeight" step="0.001" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]">
                    </div>
                </div>
                <div>
                    <label for="weightLossDisplay" class="block text-sm font-medium text-[var(--text-secondary)]" data-i18n-key="weightLoss"></label>
                    <div id="weightLossDisplay" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-secondary)] border border-[var(--border-color)] rounded-md shadow-sm sm:text-sm text-[var(--text-primary)]">- %</div>
                </div>

                <div class="pt-4 border-t border-[var(--border-color)]">
                    <h3 class="text-md font-medium text-[var(--text-primary)]" data-i18n-key="evaluationOptional"></h3>

                    <div class="mb-4 pb-4">
                        <label class="block text-sm font-bold text-[var(--text-primary)]" data-i18n-key="overallRatingSubjective"></label>
                        <div id="overallRatingStars" class="flex items-center mt-2"></div>
                        <input type="hidden" name="overallRating" id="overallRatingInput">
                    </div>

                    <details id="cuppingLogDetails">
                        <summary class="cursor-pointer text-sm font-medium text-indigo-600 hover:text-indigo-800" data-i18n-key="detailedCuppingLog">
                        </summary>
                        <div class="mt-4 border-t pt-4 space-y-4 border-[var(--border-color)]">

                            <div>
                                <label class="block text-sm font-bold text-[var(--text-primary)] mb-2" data-i18n-key="flavorProfileMulti"></label>
                                <div id="flavorTagsContainer" class="flex flex-wrap gap-2">
                                    </div>
                                <input type="hidden" id="flavorProfile" name="flavorProfile">
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-[var(--text-primary)]" data-i18n-key="acidity"></label>
                                <div class="mt-2 space-y-2">
                                    <label class="block text-xs font-medium text-[var(--text-secondary)]" data-i18n-key="intensity"></label>
                                    <div class="flex items-center gap-x-2 text-xs text-[var(--text-secondary)]">
                                        <span data-i18n-key="weak"></span>
                                        <input type="range" id="acidityIntensity" name="acidityIntensity" min="1" max="5" value="3" class="w-full">
                                        <span data-i18n-key="strong"></span>
                                    </div>
                                    <label class="block text-xs font-medium text-[var(--text-secondary)] mt-2" data-i18n-key="quality"></label>
                                    <div id="acidityQualityTags" class="flex flex-wrap gap-2">
                                         </div>
                                    <input type="hidden" id="acidityQuality" name="acidityQuality">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-[var(--text-primary)]" data-i18n-key="body"></label>
                                <div class="mt-2 space-y-2">
                                    <label class="block text-xs font-medium text-[var(--text-secondary)]" data-i18n-key="weight"></label>
                                    <div class="flex items-center gap-x-2 text-xs text-[var(--text-secondary)]">
                                        <span data-i18n-key="light"></span>
                                        <input type="range" id="bodyWeight" name="bodyWeight" min="1" max="5" value="3" class="w-full">
                                        <span data-i18n-key="heavy"></span>
                                    </div>
                                    <label class="block text-xs font-medium text-[var(--text-secondary)] mt-2" data-i18n-key="texture"></label>
                                    <div id="bodyTextureTags" class="flex flex-wrap gap-2">
                                         </div>
                                    <input type="hidden" id="bodyTexture" name="bodyTexture">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-[var(--text-primary)]" data-i18n-key="aftertaste"></label>
                                <div class="mt-2 space-y-2">
                                    <label class="block text-xs font-medium text-[var(--text-secondary)]" data-i18n-key="length"></label>
                                    <div class="flex items-center gap-x-2 text-xs text-[var(--text-secondary)]">
                                        <span data-i18n-key="short"></span>
                                        <input type="range" id="aftertasteLength" name="aftertasteLength" min="1" max="5" value="3" class="w-full">
                                        <span data-i18n-key="long"></span>
                                    </div>
                                    <label class="block text-xs font-medium text-[var(--text-secondary)] mt-2" data-i18n-key="quality"></label>
                                    <div class="flex items-center gap-x-2 text-xs text-[var(--text-secondary)]">
                                        <span data-i18n-key="unpleasant"></span>
                                        <input type="range" id="aftertasteQuality" name="aftertasteQuality" min="1" max="5" value="3" class="w-full">
                                        <span data-i18n-key="clean"></span>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-[var(--text-primary)]" data-i18n-key="balance"></label>
                                <div class="mt-2 space-y-2">
                                    <div class="flex items-center gap-x-2 text-xs text-[var(--text-secondary)]">
                                        <span data-i18n-key="unstructured"></span>
                                        <input type="range" id="balance" name="balance" min="1" max="5" value="3" class="w-full">
                                        <span data-i18n-key="harmonious"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </details>
                </div>

                <!-- Notes -->
                <div>
                    <label for="notes" class="block text-sm font-medium text-[var(--text-secondary)] mb-1" data-i18n-key="notesOptional"></label>
                    <textarea id="notes" name="notes" rows="3" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]"></textarea>
                </div>
                <div>
                    <label for="aiNotes" class="block text-sm font-medium text-[var(--text-secondary)] mb-1" data-i18n-key="aiEvaluationOptional"></label>
                    <textarea id="aiNotes" name="aiNotes" rows="4" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-md shadow-sm text-[var(--text-primary)]"></textarea>
                </div>
            </div>
        </fieldset>
        
        <div class="flex justify-end space-x-4 pt-6 border-t border-[var(--border-color)]">
            <button type="button" id="cancelEditButton" class="px-4 py-2 border border-[var(--border-color)] text-[var(--text-primary)] rounded-md hover:bg-[var(--bg-secondary)]" data-i18n-key="cancel"></button>
            <button type="submit" id="saveRecordButton" class="btn-primary inline-flex items-center gap-x-2 px-6 py-2 text-white rounded-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm5 6a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V8z" clip-rule="evenodd" /></svg>
                <span data-i18n-key="saveRecord"></span>
            </button>
        </div>
    </form>
</section>
