<section id="roastFormSection" class="mb-8 p-6 bg-white rounded-lg shadow-md hidden">
    <h2 id="formTitle" class="text-2xl font-semibold mb-6 text-amber-600">新しい焙煎を記録</h2>
    <form id="roastForm" class="space-y-6">
        <input type="hidden" id="editRoastId" name="editRoastId">

        <fieldset class="border-t pt-4">
            <legend class="text-lg font-medium text-gray-900 mb-4">焙煎前の計画 (Plan)</legend>
            <div class="space-y-6">
                <div>
                    <label for="beanIdSelect" class="block text-sm font-medium text-gray-700 mb-1">使用する豆 <span class="text-red-500">*</span></label>
                    <select id="beanIdSelect" name="beanId" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm"></select>
                </div>
                <div>
                    <label for="roastDate" class="block text-sm font-medium text-gray-700 mb-1">焙煎日 <span class="text-red-500">*</span></label>
                    <input type="date" id="roastDate" name="roastDate" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                </div>
                <div>
                    <label for="roastLevelSlider" class="block text-sm font-medium text-gray-700">目標の焙煎度</label>
                    <input type="range" id="roastLevelSlider" name="roastLevelSlider" min="1" max="8" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer mt-2">
                    <div id="roastLevelLabel" class="text-center text-sm text-gray-800 font-semibold mt-1">シティロースト</div>
                    <input type="hidden" id="roastLevel" name="roastLevel" value="シティロースト">
                </div>
                <div>
                    <label for="greenBeanWeight" class="block text-sm font-medium text-gray-700 mb-1">生豆重量 (kg) <span class="text-red-500">*</span></label>
                    <input type="number" id="greenBeanWeight" name="greenBeanWeight" step="0.001" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm" placeholder="例: 0.2">
                </div>
                <div>
                    <label for="targetFlavor" class="block text-sm font-medium text-gray-700">目標とする風味 (任意)</label>
                    <input type="text" id="targetFlavor" name="targetFlavor" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm" placeholder="例: フルーティーな酸味を際立たせる">
                </div>
                <div>
                    <label for="roasterModel" class="block text-sm font-medium text-gray-700">使用する焙煎機 (任意)</label>
                    <input type="text" id="roasterModel" name="roasterModel" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm" placeholder="例: Aillio Bullet R1 (半熱風式)">
                </div>
                <div class="space-y-2 pt-4 border-t border-gray-200">
                    <h3 class="text-md font-medium text-gray-900">焙煎時の気候 (任意)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                        <div>
                            <label for="roastWeatherTemp" class="block text-sm font-medium text-gray-700">気温 (°C)</label>
                            <input type="text" id="roastWeatherTemp" name="roastWeatherTemp" class="mt-1 block w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm sm:text-sm" readonly placeholder="未取得">
                        </div>
                        <div>
                            <label for="roastWeatherHumidity" class="block text-sm font-medium text-gray-700">湿度 (%)</label>
                            <input type="text" id="roastWeatherHumidity" name="roastWeatherHumidity" class="mt-1 block w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm sm:text-sm" readonly placeholder="未取得">
                        </div>
                    </div>
                    <button type="button" id="fetchWeatherButton" class="mt-2 px-3 py-1.5 border border-blue-500 rounded-md shadow-sm text-sm font-medium text-blue-600 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-400">現在地の気候情報を取得</button>
                </div>
                <div class="space-y-4 pt-4 border-t border-gray-200">
                    <h3 class="text-md font-medium text-gray-900">AI 連携</h3>
                    <div class="tooltip">
                        <button type="button" id="generateAiPromptButton" class="w-full px-4 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700">
                            🤖 外部AIへの質問を作成 (コピー)
                        </button>
                        <span class="tooltiptext">現在のフォーム入力からAIへの質問プロンプトを生成し、クリップボードにコピーします。</span>
                    </div>
                    <div>
                        <label for="aiProfileInput" class="block text-sm font-medium text-gray-700">AIからの提案をペースト</label>
                        <textarea id="aiProfileInput" rows="5" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm" placeholder="例:\n1分: 150.0℃\n2分: 165.5℃\n..."></textarea>
                    </div>
                    <div class="tooltip">
                        <button type="button" id="applyAiProfileButton" class="w-full px-4 py-2 bg-teal-600 text-white font-medium rounded-md hover:bg-teal-700">
                            AIの提案を貼り付けてグラフ表示
                        </button>
                        <span class="tooltiptext">テキストエリアのデータを解析し、目標プロファイルとしてグラフに点線で表示します。</span>
                    </div>
                </div>
            </div>
        </fieldset>
        
        <fieldset class="border-t pt-4">
            <legend class="text-lg font-medium text-gray-900 mb-4">焙煎中の記録 (Roast)</legend>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                <div>
                    <label for="chargingTemperature" class="block text-sm font-medium text-gray-700">投入温度 (°C)</label>
                    <input type="number" id="chargingTemperature" name="chargingTemperature" step="0.1" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                </div>
                <div>
                    <label for="turningPointTime" class="block text-sm font-medium text-gray-700">TP時間 (分:秒)</label>
                    <input type="text" id="turningPointTime" name="turningPointTime" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                </div>
                <div>
                    <label for="turningPointTemp" class="block text-sm font-medium text-gray-700">TP温度 (°C)</label>
                    <input type="number" id="turningPointTemp" name="turningPointTemp" step="0.1" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                </div>
                <div>
                    <label for="firstCrackTime" class="block text-sm font-medium text-gray-700">1ハゼ時間 (分:秒)</label>
                    <input type="text" id="firstCrackTime" name="firstCrackTime" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                </div>
                <div>
                    <label for="secondCrackTime" class="block text-sm font-medium text-gray-700">2ハゼ時間 (分:秒)</label>
                    <input type="text" id="secondCrackTime" name="secondCrackTime" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                </div>
                 <div>
                    <label for="endOfRoastTemp" class="block text-sm font-medium text-gray-700">煎り止め温度 (°C)</label>
                    <input type="number" id="endOfRoastTemp" name="endOfRoastTemp" step="0.1" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                </div>
            </div>
        </fieldset>

        <fieldset class="border-t pt-4">
            <legend class="text-lg font-medium text-gray-900 mb-4">焙煎後の評価 (Review)</legend>
            <div class="space-y-6">
                <!-- Time and Weight -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="totalRoastTime" class="block text-sm font-medium text-gray-700">総焙煎時間 (分:秒) <span class="text-red-500">*</span></label>
                        <input type="text" id="totalRoastTime" name="totalRoastTime" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                    </div>
                    <div>
                        <label for="roastedBeanWeight" class="block text-sm font-medium text-gray-700">焙煎豆重量 (kg)</label>
                        <input type="number" id="roastedBeanWeight" name="roastedBeanWeight" step="0.001" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                    </div>
                </div>
                <div>
                    <label for="weightLossDisplay" class="block text-sm font-medium text-gray-700">重量減少率</label>
                    <div id="weightLossDisplay" class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md shadow-sm sm:text-sm">- %</div>
                </div>

                <!-- New Review Section -->
                <div class="pt-4 border-t border-gray-200">
                    <h3 class="text-md font-medium text-gray-900 mb-4">クイック評価</h3>
                    <div class="space-y-4" id="ratingsContainer">
                        <!-- Bitterness -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700">苦味 (Bitterness)</label>
                            <div class="flex items-center space-x-4 mt-1" data-rating-group="bitterness">
                                <span class="text-xs text-gray-500">弱い</span>
                                <div class="flex items-center space-x-3">
                                    <input type="radio" id="bitterness1" name="bitterness" value="1" class="form-radio h-4 w-4 text-amber-600"><label for="bitterness1" class="text-sm">1</label>
                                    <input type="radio" id="bitterness2" name="bitterness" value="2" class="form-radio h-4 w-4 text-amber-600"><label for="bitterness2" class="text-sm">2</label>
                                    <input type="radio" id="bitterness3" name="bitterness" value="3" class="form-radio h-4 w-4 text-amber-600"><label for="bitterness3" class="text-sm">3</label>
                                    <input type="radio" id="bitterness4" name="bitterness" value="4" class="form-radio h-4 w-4 text-amber-600"><label for="bitterness4" class="text-sm">4</label>
                                    <input type="radio" id="bitterness5" name="bitterness" value="5" class="form-radio h-4 w-4 text-amber-600"><label for="bitterness5" class="text-sm">5</label>
                                </div>
                                <span class="text-xs text-gray-500">強い</span>
                            </div>
                        </div>
                        <!-- Sweetness -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700">甘味 (Sweetness)</label>
                            <div class="flex items-center space-x-4 mt-1" data-rating-group="sweetness">
                                <span class="text-xs text-gray-500">弱い</span>
                                <div class="flex items-center space-x-3">
                                    <input type="radio" id="sweetness1" name="sweetness" value="1" class="form-radio h-4 w-4 text-amber-600"><label for="sweetness1" class="text-sm">1</label>
                                    <input type="radio" id="sweetness2" name="sweetness" value="2" class="form-radio h-4 w-4 text-amber-600"><label for="sweetness2" class="text-sm">2</label>
                                    <input type="radio" id="sweetness3" name="sweetness" value="3" class="form-radio h-4 w-4 text-amber-600"><label for="sweetness3" class="text-sm">3</label>
                                    <input type="radio" id="sweetness4" name="sweetness" value="4" class="form-radio h-4 w-4 text-amber-600"><label for="sweetness4" class="text-sm">4</...
                                    <input type="radio" id="sweetness5" name="sweetness" value="5" class="form-radio h-4 w-4 text-amber-600"><label for="sweetness5" class="text-sm">5</label>
                                </div>
                                <span class="text-xs text-gray-500">強い</span>
                            </div>
                        </div>
                    </div>
                </div>

                <details class="group pt-4 border-t border-gray-200">
                    <summary class="text-blue-600 hover:underline cursor-pointer group-open:mb-4 text-md font-medium">
                        + 詳細なカッピングログを記録する
                    </summary>
                    <div class="space-y-8 pl-4 border-l-2 border-gray-200">
                        <!-- Flavor Profile -->
                        <div>
                            <h4 class="text-sm font-medium text-gray-800 mb-2">フレーバープロファイル</h4>
                            <input type="hidden" id="flavorProfile" name="flavorProfile">
                            <div class="flex flex-wrap gap-2" data-input-target="flavorProfile">
                                <div class="w-full text-xs text-gray-500 mb-1">フルーティー:</div>
                                <button type="button" class="tag-button" data-value="Berry">Berry</button>
                                <button type="button" class="tag-button" data-value="Citrus">Citrus</button>
                                <div class="w-full text-xs text-gray-500 mt-2 mb-1">甘い:</div>
                                <button type="button" class="tag-button" data-value="Chocolate">Chocolate</button>
                                <button type="button" class="tag-button" data-value="Caramel">Caramel</button>
                            </div>
                        </div>
                        <!-- Acidity -->
                        <div>
                            <h4 class="text-sm font-medium text-gray-800 mb-2">酸味 (Acidity)</h4>
                            <label class="block text-xs text-gray-600">強さ (Intensity): <span id="acidityIntensityLabel" class="font-bold">普通</span></label>
                            <input type="range" id="acidityIntensity" min="1" max="5" value="3" class="w-full slider">
                            <input type="hidden" id="acidityQuality" name="acidityQuality">
                            <label class="block text-xs text-gray-600 mt-2">質 (Quality):</label>
                            <div class="flex flex-wrap gap-2 mt-1" data-input-target="acidityQuality">
                                <button type="button" class="tag-button" data-value="爽やか">爽やか</button>
                                <button type="button" class="tag-button" data-value="ジューシー">ジューシー</button>
                            </div>
                        </div>
                        <!-- Body -->
                        <div>
                            <h4 class="text-sm font-medium text-gray-800 mb-2">ボディ (Body)</h4>
                            <label class="block text-xs text-gray-600">重さ (Weight): <span id="bodyWeightLabel" class="font-bold">普通</span></label>
                            <input type="range" id="bodyWeight" min="1" max="5" value="3" class="w-full slider">
                            <input type="hidden" id="bodyTexture" name="bodyTexture">
                            <label class="block text-xs text-gray-600 mt-2">舌触り (Texture):</label>
                            <div class="flex flex-wrap gap-2 mt-1" data-input-target="bodyTexture">
                                <button type="button" class="tag-button" data-value="シルキー">シルキー</button>
                                <button type="button" class="tag-button" data-value="クリーミー">クリーミー</button>
                            </div>
                        </div>
                        <!-- Aftertaste -->
                        <div>
                            <h4 class="text-sm font-medium text-gray-800 mb-2">後味 (Aftertaste)</h4>
                            <label class="block text-xs text-gray-600">長さ (Length): <span id="aftertasteLengthLabel" class="font-bold">普通</span></label>
                            <input type="range" id="aftertasteLength" name="aftertasteLength" min="1" max="5" value="3" class="w-full slider">
                            <label class="block text-xs text-gray-600 mt-2">質 (Quality): <span id="aftertasteQualityLabel" class="font-bold">普通</span></label>
                            <input type="range" id="aftertasteQuality" name="aftertasteQuality" min="1" max="5" value="3" class="w-full slider">
                        </div>
                        <!-- Balance -->
                        <div>
                            <h4 class="text-sm font-medium text-gray-800 mb-2">バランス (Balance)</h4>
                            <label class="block text-xs text-gray-600"><span id="balanceLabel" class="font-bold">普通</span></label>
                            <input type="range" id="balance" name="balance" min="1" max="5" value="3" class="w-full slider">
                        </div>
                    </div>
                </details>

                <!-- Notes -->
                <div>
                    <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">メモ (任意)</label>
                    <textarea id="notes" name="notes" rows="3" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm"></textarea>
                </div>
                <div>
                    <label for="aiNotes" class="block text-sm font-medium text-gray-700 mb-1">AIによる評価 (任意)</label>
                    <textarea id="aiNotes" name="aiNotes" rows="4" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm"></textarea>
                </div>
            </div>
        </fieldset>
        
        <div class="flex justify-end space-x-3 pt-6 border-t">
            <button type="button" id="cancelEditButton" class="px-4 py-2 border rounded-md">キャンセル</button>
            <button type="submit" id="saveRecordButton" class="px-6 py-2 bg-amber-600 text-white rounded-md">記録を保存</button>
        </div>
    </form>
</section>
