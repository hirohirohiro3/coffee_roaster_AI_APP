<div id="add-employee-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center z-50">
    <div class="relative mx-auto p-5 border w-full max-w-md shadow-lg rounded-md bg-white">
        <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">モーダルタイトル</h3>
        <form id="add-employee-form">
            <div class="mb-4">
                <label for="employee-name-input" class="block text-sm font-medium text-gray-700">従業員名</label>
                <input type="text" id="employee-name-input" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" required>
            </div>
            <div class="mb-4">
                <label for="employee-work-days-input" class="block text-sm font-medium text-gray-700">週の勤務日数</label>
                <select id="employee-work-days-input" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="5">週5日</option>
                    <option value="4">週4日</option>
                    <option value="3">週3日</option>
                    <option value="2">週2日</option>
                    <option value="1">週1日</option>
                </select>
            </div>
            <div class="mb-6">
                <label for="employee-hire-date-input" class="block text-sm font-medium text-gray-700">雇入れ年月日</label>
                <input type="date" id="employee-hire-date-input" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" required>
            </div>
            <div class="items-center gap-4 flex justify-end">
                <button id="cancel-modal-button" type="button" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">キャンセル</button>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">保存</button>
            </div>
        </form>
    </div>
</div>
