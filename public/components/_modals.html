<!-- _modals.html (UI改善・必須項目・ID重複を全て修正した最終版) -->

<!-- Confirm Modal -->
<div id="confirmModal" class="modal hidden">
    <div class="modal-content modal-content-small">
        <span class="close-button" id="closeConfirmModalButton">&times;</span>
        <p id="confirmModalMessage" class="text-lg mb-6"></p>
        <div class="flex justify-end space-x-3">
            <button id="cancelConfirmButton" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">キャンセル</button>
            <button id="confirmActionButton" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700">実行</button>
        </div>
    </div>
</div>

<!-- Profile Modal -->
<div id="profileModal" class="modal hidden">
    <div class="modal-content modal-content-profile">
        <span class="close-button" id="closeProfileModalButton">&times;</span>
        <h3 id="profileModalTitle" class="text-xl font-semibold text-amber-700 mb-4">焙煎プロファイル詳細</h3>
        
        <div class="h-80 md:h-96 mb-6"><canvas id="roastProfileChart"></canvas></div>
        <p id="profileMessage" class="text-xs text-gray-500 text-center mb-4">プロファイルを生成中...</p>
        
        <div class="flex justify-between items-center mt-6 mb-2">
            <h4 class="text-lg font-semibold text-gray-800">焙煎データログ (時系列)</h4>
            <div id="logEditButtonsContainer">
                <button id="editTemperaturesButton" class="px-3 py-1 text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 rounded shadow-sm">温度を編集</button>
                <button id="saveTemperaturesButton" class="px-3 py-1 text-xs bg-blue-500 hover:bg-blue-600 text-white rounded shadow-sm hidden">変更を保存</button>
                <button id="cancelEditTemperaturesButton" class="px-3 py-1 text-xs bg-gray-500 hover:bg-gray-600 text-white rounded shadow-sm hidden">キャンセル</button>
            </div>
        </div>
        <div id="profileTransposedLogTableContainer" class="w-full overflow-x-auto mb-4 border border-gray-200 rounded"></div>
                
        <div id="profileRoastSummary" class="mt-4 pt-4 border-t border-gray-200 text-sm">
            <h4 class="text-md font-semibold text-gray-700 mb-1">焙煎サマリー</h4>
            <p>焙煎ID: <span id="profileRoastId" class="font-medium text-gray-900 bg-gray-100 px-2 py-1 rounded">-</span></p>
            <p>総焙煎時間: <span id="profileSummaryTotalTime" class="font-medium">-</span></p>
            <p>重量減少率: <span id="profileSummaryWeightLoss" class="font-medium">-</span> %</p>
            <p>DTR (Development Time Ratio): <span id="profileSummaryDTR" class="font-medium">-</span> %</p>
        </div>
        
        <div id="profileWeatherInfo" class="mt-4 pt-4 border-t border-gray-200 text-sm">
            <h4 class="text-md font-semibold text-gray-700 mb-1">記録時の気候</h4>
            <p>気温: <span id="profileWeatherTemp" class="font-medium">-</span> °C</p>
            <p>湿度: <span id="profileWeatherHumidity" class="font-medium">-</span> %</p>
        </div>

        <div id="profileAiNotesSection" class="mt-4 pt-4 border-t border-gray-200 text-sm" style="display: none;">
            <h4 class="text-md font-semibold text-gray-700 mb-1">AIによる評価</h4>
            <p id="profileAiNotes" class="mt-1 p-2 bg-gray-50 rounded whitespace-pre-wrap text-xs font-mono"></p>
        </div>

        <div id="radarChartSection" class="mt-4 pt-4 border-t border-gray-200" style="display: none;">
            <h4 class="text-md font-semibold text-gray-700 mb-2">評価レーダーチャート</h4>
            <div class="w-full max-w-sm mx-auto h-64 md:h-80">
                <canvas id="profileRadarChart"></canvas>
            </div>
        </div>
        
        <div class="mt-6 flex justify-end">
            <button id="copyProfileJsonButton" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-sky-600 hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">全データ(JSON)をコピー</button>
        </div>
    </div>
</div>

<!-- Bean Stock Modal -->
<div id="beanStockModal" class="modal hidden">
    <div class="modal-content modal-content-large">
        <span class="close-button" id="closeBeanStockModalButton">&times;</span>
        <h3 class="text-xl font-semibold text-amber-700 mb-4">生豆の在庫管理</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="border-r-0 md:border-r md:pr-6 border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <h4 class="text-lg font-semibold text-gray-800">在庫リスト</h4>
                    <button id="addNewBeanButton" class="px-3 py-1 text-xs bg-green-500 hover:bg-green-600 text-white rounded shadow-sm transition-all duration-200">+ 新規登録</button>
                </div>
                <div class="mb-3">
                    <label for="show-empty-beans-checkbox" class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="show-empty-beans-checkbox" name="show-empty-beans-checkbox" class="rounded border-gray-300 text-amber-600 shadow-sm focus:border-amber-300 focus:ring focus:ring-amber-200 focus:ring-opacity-50">
                        <span class="ml-2 text-sm text-gray-600">在庫切れの豆を表示する</span>
                    </label>
                </div>
                <div id="beanStockListContainer" class="space-y-3 h-96 overflow-y-auto pr-2">
                    <p class="text-gray-500 italic">在庫データを読み込み中...</p>
                </div>
            </div>
            <div>
                <h4 id="beanStockFormTitle" class="text-lg font-semibold text-gray-800 mb-2">新規生豆を登録</h4>
                <form id="beanStockForm" class="space-y-4">
                    <input type="hidden" id="beanId" name="beanId">
                    <div>
                        <label for="beanName" class="block text-sm font-medium text-gray-700">豆の名前 <span class="text-red-500">*</span></label>
                        <input type="text" id="beanName" name="beanName" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="beanOrigin" class="block text-sm font-medium text-gray-700">産地</label>
                            <input type="text" id="beanOrigin" name="origin" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="process" class="block text-sm font-medium text-gray-700">精製方法</label>
                            <input type="text" id="process" name="process" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm" placeholder="例: ナチュラル">
                        </div>
                    </div>
                     <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="purchaseDate" class="block text-sm font-medium text-gray-700">購入日</label>
                            <input type="date" id="purchaseDate" name="purchaseDate" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="farm" class="block text-sm font-medium text-gray-700">農園名</label>
                            <input type="text" id="farm" name="farm" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                        </div>
                    </div>
                    <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="purchaseAmount" class="block text-sm font-medium text-gray-700">購入量 (g) <span class="text-red-500">*</span></label>
                                <input type="number" id="purchaseAmount" name="purchaseAmount" step="0.1" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                            </div>
                             <div>
                                <label for="price" class="block text-sm font-medium text-gray-700">購入価格 (円) <span class="text-red-500">*</span></label>
                                <input type="number" id="price" name="price" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                                <p class="text-xs text-gray-500 mt-1">袋全体の合計金額です。</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-medium text-gray-600">単価: <span id="unitPriceDisplay" class="font-bold text-amber-700">- 円/g</span></p>
                        </div>
                    </div>
                    <div>
                        <label for="beanNotes" class="block text-sm font-medium text-gray-700">メモ</label>
                        <textarea id="beanNotes" name="notes" rows="3" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-2">
                         <button type="button" id="cancelBeanFormButton" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">キャンセル</button>
                        <button type="submit" id="saveBeanButton" class="px-6 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-amber-600 hover:bg-amber-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
