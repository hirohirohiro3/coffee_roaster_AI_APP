<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | 有給管理アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js"
        }
    }
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">新規アカウント登録</h2>
        <form id="register-form">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">メールアドレス</label>
                <input type="email" id="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">パスワード</label>
                <input type="password" id="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" required placeholder="6文字以上">
            </div>
            <div class="mb-6">
                <label for="company-code" class="block text-gray-700 text-sm font-bold mb-2">会社コード</label>
                <input type="text" id="company-code" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required placeholder="管理者から共有されたコード">
            </div>
            
            <p id="error-message" class="text-red-500 text-xs italic mb-4 h-4"></p>

            <div class="flex items-center justify-between">
                <button type="submit" id="register-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    登録する
                </button>
                <a href="login.html" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                    ログインはこちら
                </a>
            </div>
        </form>
    </div>

    <script type="module" src="src/firebase-config.js"></script>
    <script type="module" src="src/register.js"></script>
</body>
</html>
