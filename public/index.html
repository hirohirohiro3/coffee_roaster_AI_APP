<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コーヒー焙煎記録</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/2.2.1/chartjs-plugin-annotation.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script src="https://www.google.com/recaptcha/api.js?render=YOUR_SITE_KEY_HERE"></script>
    </head>
<body class="is-auth-page">
    <div id="debug-panel"></div>
    <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-5xl">
        
        <div id="authSection">
            </div>

        <div id="main-content" class="hidden">
            <header id="header-container">
                </header>

            <div id="page-container">
                <div id="roast-list-page">
                    <div id="add-new-button-container" class="my-6 text-center"></div>
                    <main>
                        <div id="timer-container"></div>
                        <div id="roast-form-container"></div>
                        <div id="filter-sort-container"></div>
                        <div id="roast-list-container" class="mt-6"></div>
                    </main>
                </div>

                <div id="statistics-page" class="hidden">
                    </div>
            </div>

            <footer id="footer-container" class="mt-12 pt-8 border-t border-[var(--border-color)]">
                </footer>
        </div>
    </div>

    <div id="modals-container"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-[2001] space-y-2"></div>

    <script>
        window.updateDebugStatus = (message) => {
            const panel = document.getElementById('debug-panel');
            if (panel) {
                const timestamp = new Date().toLocaleTimeString();
                const newMessage = document.createElement('div');
                newMessage.textContent = `[${timestamp}] ${message}`;
                panel.prepend(newMessage);
                // Keep the panel from getting too long
                while (panel.children.length > 10) {
                    panel.removeChild(panel.lastChild);
                }
            }
        };
    </script>
    <script type="module">
        import App from './app.js';
        
        window.onload = () => {
            const app = new App();
            app.start();
        };
    </script>
</body>
</html>
