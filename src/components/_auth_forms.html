<div id="emailAuthFormsContainer">
    <div id="loginFormContainer">
        <h3 class="text-lg font-semibold mb-3 text-center text-[var(--accent-color)]" data-i18n-key="auth.loginTitle"></h3>
        <form id="loginForm" class="space-y-3">
            <div>
                <label for="loginEmail" class="block text-xs font-medium text-[var(--text-secondary)]" data-i18n-key="auth.emailLabel"></label>
                <input type="email" id="loginEmail" name="loginEmail" required autocomplete="email" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] text-[var(--text-primary)] rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
            </div>
            <div>
                <label for="loginPassword" class="block text-xs font-medium text-[var(--text-secondary)]" data-i18n-key="auth.passwordLabel"></label>
                <input type="password" id="loginPassword" name="loginPassword" required autocomplete="current-password" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] text-[var(--text-primary)] rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
            </div>
            <button type="submit" id="loginButton" class="w-full px-4 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors" data-i18n-key="auth.loginButton"></button>
        </form>
        <p class="mt-3 text-xs text-center text-[var(--text-secondary)]">
            <span data-i18n-key="auth.noAccountPrompt"></span>
            <button id="showSignUpFormButton" type="button" class="font-medium text-[var(--accent-color)] hover:brightness-110 hover:underline" data-i18n-key="auth.showSignUpButton"></button>
        </p>
    </div>

    <div id="signUpFormContainer" class="hidden">
        <h3 class="text-lg font-semibold mb-3 text-center text-[var(--accent-color)]" data-i18n-key="auth.signUpTitle"></h3>
        <form id="signUpForm" class="space-y-3">
            <div>
                <label for="signUpEmail" class="block text-xs font-medium text-[var(--text-secondary)]" data-i18n-key="auth.emailLabel"></label>
                <input type="email" id="signUpEmail" name="signUpEmail" required autocomplete="email" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] text-[var(--text-primary)] rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
            </div>
            <div>
                <label for="signUpPassword" class="block text-xs font-medium text-[var(--text-secondary)]" data-i18n-key="auth.passwordLabel"></label>
                <input type="password" id="signUpPassword" name="signUpPassword" required minlength="6" autocomplete="new-password" class="mt-1 block w-full px-3 py-2 bg-[var(--bg-primary)] border border-[var(--border-color)] text-[var(--text-primary)] rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm" data-i18n-placeholder-key="auth.signUpPasswordPlaceholder">
            </div>
            <button type="submit" id="signUpButton" class="w-full px-4 py-2 bg-green-600 text-white font-medium rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors" data-i18n-key="auth.signUpButton"></button>
        </form>
        <p class="mt-3 text-xs text-center text-[var(--text-secondary)]">
            <span data-i18n-key="auth.hasAccountPrompt"></span>
            <button id="showLoginFormButton" type="button" class="font-medium text-[var(--accent-color)] hover:brightness-110 hover:underline" data-i18n-key="auth.showLoginButton"></button>
        </p>
    </div>
</div>
