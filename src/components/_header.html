<header class="bg-[var(--bg-primary)] shadow-md rounded-lg p-6 mb-8">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-[var(--text-primary)]" data-i18n-key="appTitle"></h1>
            <p class="text-[var(--text-secondary)]" data-i18n-key="appSubtitle"></p>
        </div>
        <div class="flex items-center space-x-4">
            <div id="language-switcher" class="text-sm">
                <button data-lang="ja" class="font-medium" data-i18n-key="header.langJa"></button>
                <span class="mx-1">|</span>
                <button data-lang="en" class="font-medium" data-i18n-key="header.langEn"></button>
            </div>
            <div id="userInfo" class="hidden text-right">
            </div>
            <button id="theme-toggle" type="button" class="p-2 rounded-full text-[var(--text-secondary)] hover:bg-[var(--bg-secondary)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--accent-color)]">
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
            </button>
        </div>
    </div>
    <nav class="mt-4 border-b border-[var(--border-color)]">
        <ul class="flex -mb-px">
            <li class="mr-1">
                <a href="#/list" id="nav-list" class="nav-link inline-block py-2 px-4 text-[var(--text-secondary)] hover:text-[var(--text-primary)] font-semibold" data-i18n-key="navRecords"></a>
            </li>
            <li class="mr-1">
                <a href="#/stats" id="nav-stats" class="nav-link inline-block py-2 px-4 text-[var(--text-secondary)] hover:text-[var(--text-primary)] font-semibold" data-i18n-key="navStats"></a>
            </li>
        </ul>
    </nav>
</header>
